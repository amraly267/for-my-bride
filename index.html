<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For My Bride ❤️</title>


  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    /* =========================
       BODY
    ========================== */

    body {

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(circle at 50% 20%,
          #fff8f4 0%,
          #f8f1eb 45%,
          #f1e3dc 100%);

      font-family:
        "Noto Serif KR",
        "Georgia",
        serif;

      overflow: hidden;

      color: #641f32;

    }


    /* =========================
       BACKGROUND GLOW
    ========================== */

    body::before {

      content: "";

      position: fixed;

      width: 450px;
      height: 450px;

      border-radius: 50%;

      background:
        rgba(100, 31, 50, .07);

      filter:
        blur(80px);

      animation:
        backgroundGlow 7s ease-in-out infinite alternate;

      pointer-events: none;

    }


    @keyframes backgroundGlow {

      from {

        transform:
          scale(.8);

        opacity:
          .5;

      }

      to {

        transform:
          scale(1.2);

        opacity:
          .9;

      }

    }


    /* =========================
       FLOATING BACKGROUND HEARTS
    ========================== */

    .heart {

      position: fixed;

      bottom: -40px;

      font-size: 18px;

      opacity: 0;

      pointer-events: none;

      animation:
        floatHeart 9s linear infinite;

      z-index: 0;

    }


    .heart:nth-child(1) {

      left: 8%;

      animation-delay:
        0s;

    }


    .heart:nth-child(2) {

      left: 23%;

      animation-delay:
        2s;

      font-size:
        13px;

    }


    .heart:nth-child(3) {

      left: 48%;

      animation-delay:
        4s;

      font-size:
        22px;

    }


    .heart:nth-child(4) {

      left: 72%;

      animation-delay:
        1s;

      font-size:
        14px;

    }


    .heart:nth-child(5) {

      left: 90%;

      animation-delay:
        3s;

      font-size:
        20px;

    }


    @keyframes floatHeart {

      0% {

        transform:
          translateY(0) rotate(0deg) scale(.6);

        opacity:
          0;

      }


      15% {

        opacity:
          .65;

      }


      50% {

        transform:
          translateY(-50vh) rotate(15deg) scale(1);

      }


      100% {

        transform:
          translateY(-115vh) rotate(-15deg) scale(1.3);

        opacity:
          0;

      }

    }


    /* =========================
       CARD
    ========================== */

    .card {

      position:
        relative;

      z-index:
        2;

      width:
        min(90%, 430px);

      padding:
        48px 28px 38px;

      text-align:
        center;

      background:
        rgba(255, 255, 255, .72);

      border:
        1px solid rgba(100, 31, 50, .14);

      border-radius:
        30px;

      box-shadow:

        0 25px 70px rgba(80, 25, 40, .13),

        inset 0 0 40px rgba(255, 255, 255, .4);

      backdrop-filter:
        blur(14px);

      overflow:
        hidden;

      animation:
        cardAppear 1.2s cubic-bezier(.22, .61, .36, 1);

    }


    /* =========================
       CARD SHINE
    ========================== */

    .card::before {

      content:
        "";

      position:
        absolute;

      top:
        -100%;

      left:
        -70%;

      width:
        45%;

      height:
        300%;

      background:
        linear-gradient(90deg,
          transparent,
          rgba(255, 255, 255, .45),
          transparent);

      transform:
        rotate(20deg);

      animation:
        shine 7s ease-in-out infinite;

      pointer-events:
        none;

    }


    @keyframes shine {

      0% {

        left:
          -70%;

      }


      35% {

        left:
          130%;

      }


      100% {

        left:
          130%;

      }

    }


    @keyframes cardAppear {

      0% {

        opacity:
          0;

        transform:
          translateY(40px) scale(.92);

        filter:
          blur(8px);

      }


      70% {

        transform:
          translateY(-5px) scale(1.01);

      }


      100% {

        opacity:
          1;

        transform:
          translateY(0) scale(1);

        filter:
          blur(0);

      }

    }


    /* =========================
       MAIN HEART
    ========================== */

    .main-heart {

      position:
        relative;

      width:
        78px;

      height:
        78px;

      margin:
        0 auto 28px;

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      background:
        #641f32;

      color:
        white;

      border-radius:
        50%;

      font-size:
        32px;

      box-shadow:
        0 10px 30px rgba(100, 31, 50, .25);

      animation:
        heartbeat 1.8s infinite,
        heartGlow 2.5s infinite;

    }


    @keyframes heartbeat {

      0%,
      100% {

        transform:
          scale(1);

      }


      12% {

        transform:
          scale(1.08);

      }


      20% {

        transform:
          scale(1);

      }


      30% {

        transform:
          scale(1.06);

      }


      45% {

        transform:
          scale(1);

      }

    }


    @keyframes heartGlow {

      0%,
      100% {

        box-shadow:

          0 10px 30px rgba(100, 31, 50, .25),

          0 0 0 0 rgba(100, 31, 50, .18);

      }


      50% {

        box-shadow:

          0 12px 35px rgba(100, 31, 50, .3),

          0 0 0 12px rgba(100, 31, 50, 0);

      }

    }


    /* =========================
       HEADER
    ========================== */

    .small-text {

      font-family:
        Arial,
        sans-serif;

      font-size:
        11px;

      letter-spacing:
        3px;

      color:
        #96717b;

      margin-bottom:
        25px;

      text-transform:
        uppercase;

      animation:
        fadeDown 1s ease .4s both;

    }


    @keyframes fadeDown {

      from {

        opacity:
          0;

        transform:
          translateY(-10px);

      }


      to {

        opacity:
          1;

        transform:
          translateY(0);

      }

    }


    /* =========================
       MESSAGE AREA
    ========================== */

    .message-box {

      min-height:
        190px;

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      position:
        relative;

    }


    .message {

      font-size:
        21px;

      line-height:
        2;

      font-weight:
        500;

      color:
        #641f32;

    }


    /* =========================
       KOREAN MESSAGE
    ========================== */

    .korean-message {

      display:
        block;

      opacity:
        1;

      transform:
        translateY(0);

      animation:
        messageAppear 1.4s ease .7s both;

    }


    @keyframes messageAppear {

      from {

        opacity:
          0;

        transform:
          translateY(18px);

        filter:
          blur(5px);

      }


      to {

        opacity:
          1;

        transform:
          translateY(0);

        filter:
          blur(0);

      }

    }


    /* =========================
       ARABIC MESSAGE
    ========================== */

    .arabic-message {

      display:
        none;

      direction:
        rtl;

      font-family:
        Tahoma,
        Arial,
        sans-serif;

    }


    .arabic-message .message {

      font-size:
        23px;

      line-height:
        2;

      font-weight:
        bold;

    }


    /* =========================
       TRANSLATION
    ========================== */

    .arabic-view .korean-message {

      display:
        none;

    }


    .arabic-view .arabic-message {

      display:
        block;

      animation:
        arabicReveal .7s cubic-bezier(.22, .61, .36, 1);

    }


    @keyframes arabicReveal {

      from {

        opacity:
          0;

        transform:
          translateY(20px) scale(.96);

        filter:
          blur(4px);

      }


      to {

        opacity:
          1;

        transform:
          translateY(0) scale(1);

        filter:
          blur(0);

      }

    }


    /* =========================
       BUTTON
    ========================== */

    button {

      position:
        relative;

      overflow:
        hidden;

      margin-top:
        15px;

      border:
        none;

      padding:
        13px 27px;

      border-radius:
        30px;

      background:
        #641f32;

      color:
        white;

      font-size:
        14px;

      cursor:
        pointer;

      transition:
        transform .25s ease,
        box-shadow .25s ease;

      box-shadow:
        0 8px 22px rgba(100, 31, 50, .22);

    }


    button::before {

      content:
        "";

      position:
        absolute;

      top:
        0;

      left:
        -100%;

      width:
        60%;

      height:
        100%;

      background:
        linear-gradient(90deg,
          transparent,
          rgba(255, 255, 255, .25),
          transparent);

      transform:
        skewX(-20deg);

      animation:
        buttonShine 4s infinite;

    }


    @keyframes buttonShine {

      0% {

        left:
          -100%;

      }


      30% {

        left:
          140%;

      }


      100% {

        left:
          140%;

      }

    }


    button:hover {

      transform:
        translateY(-3px) scale(1.03);

      box-shadow:
        0 12px 30px rgba(100, 31, 50, .3);

    }


    button:active {

      transform:
        scale(.95);

    }


    /* =========================
       SIGNATURE
    ========================== */

    .signature {

      margin-top:
        28px;

      font-size:
        12px;

      letter-spacing:
        1px;

      color:
        #96717b;

      font-family:
        Arial,
        sans-serif;

      animation:
        fadeUp 1s ease 1.4s both;

    }


    @keyframes fadeUp {

      from {

        opacity:
          0;

        transform:
          translateY(10px);

      }


      to {

        opacity:
          1;

        transform:
          translateY(0);

      }

    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 480px) {

      .card {

        width:
          90%;

        padding:
          42px 22px 34px;

      }


      .message {

        font-size:
          19px;

      }


      .arabic-message .message {

        font-size:
          21px;

      }


      .main-heart {

        width:
          70px;

        height:
          70px;

        font-size:
          29px;

      }

    }
  </style>

</head>


<body>


  <!-- =========================
       BACKGROUND HEARTS
  ========================== -->

  <div class="heart">❤️</div>

  <div class="heart">♡</div>

  <div class="heart">❤️</div>

  <div class="heart">♡</div>

  <div class="heart">❤️</div>


  <!-- =========================
       CARD
  ========================== -->

  <div class="card" id="card">


    <!-- Main Heart -->

    <div class="main-heart">

      ❤️

    </div>


    <!-- Header -->

    <div class="small-text">

      A little surprise for you

    </div>


    <!-- Message Area -->

    <div class="message-box">


      <!-- Korean -->

      <div class="korean-message" id="koreanMessage">

        <div class="message">
          운명이 우리를 이어주었고, 당신은 내 인생에서 가장 아름다운 운명이 되었어요 ❤️
          <br>
          생일 축하해, 내 신부 🥰
        </div>

      </div>


      <!-- Arabic -->

      <div class="arabic-message" id="arabicMessage">

        <div class="message">

          جمعني القدر بكِ،
          فكنتِ أجمل أقداري ❤️

          <br>

          كل مولد وإنتِ عروستي 🥰

        </div>

      </div>


    </div>


    <!-- Translation Button -->

    <button id="translateBtn" onclick="translateMessage()">

🇪🇬😂 اضغطي لو مش فاهمة الكوري 

    </button>


    <!-- Signature -->

    <div class="signature">

      Made with love ❤️

    </div>


  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>


    /* =========================
       TRANSLATION
    ========================== */

    function translateMessage() {

      const card =
        document.getElementById(
          "card"
        );

      const button =
        document.getElementById(
          "translateBtn"
        );


      /* Toggle language */

      card.classList.toggle(
        "arabic-view"
      );


      /* Change button text */

      if (
        card.classList.contains(
          "arabic-view"
        )
      ) {

        button.innerHTML =
          "🇰🇷😂 خلاص فهمنا ؟ نرجع للكوري تاني";

      }

      else {

        button.innerHTML =
          "🇪🇬😂 اضغطي لو مش فاهمة الكوري";

      }


      /* Create flying hearts */

      createHearts();

    }


    /* =========================
       FLYING HEARTS
    ========================== */

    function createHearts() {

      const card =
        document.getElementById(
          "card"
        );


      const rect =
        card.getBoundingClientRect();


      for (
        let i = 0;
        i < 14;
        i++
      ) {

        const heart =
          document.createElement(
            "div"
          );


        /* Heart type */

        heart.innerHTML =
          Math.random() > .35
            ? "❤️"
            : "♡";


        /* Starting position */

        heart.style.position =
          "fixed";


        heart.style.left =
          (
            rect.left +
            rect.width / 2
          ) + "px";


        heart.style.top =
          (
            rect.top +
            rect.height * .68
          ) + "px";


        /* Random size */

        heart.style.fontSize =
          (
            10 +
            Math.random() * 14
          ) + "px";


        heart.style.pointerEvents =
          "none";


        heart.style.zIndex =
          "20";


        document.body.appendChild(
          heart
        );


        /* Random movement */

        const x =
          (
            Math.random() - .5
          ) * 260;


        const y =
          -(
            80 +
            Math.random() * 180
          );


        const rotate =
          (
            Math.random() - .5
          ) * 90;


        const duration =
          1000 +
          Math.random() * 700;


        /* Animation */

        heart.animate(

          [

            {

              transform:
                "translate(-50%, -50%) scale(.2)",

              opacity:
                0

            },


            {

              transform:
                `translate(-50%, -50%) scale(1) rotate(${rotate}deg)`,

              opacity:
                1,

              offset:
                .25

            },


            {

              transform:
                `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(.8) rotate(${rotate * 2}deg)`,

              opacity:
                0

            }

          ],

          {

            duration:
              duration,

            easing:
              "cubic-bezier(.22,.61,.36,1)"

          }

        );


        /* Remove heart */

        setTimeout(() => heart.remove(), duration);

      }

    }

  </script>


</body>

</html>
